name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/backend/package-lock.json
            platform/frontend/package-lock.json

      - name: Backend typecheck and build
        working-directory: platform/backend
        run: npm ci && npm run build

      - name: Frontend typecheck and build
        working-directory: platform/frontend
        run: npm ci && npm run build

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Helm lint
        run: |
          helm lint charts/store -f charts/store/values-local.yaml --set store.id=ci000001
          helm lint charts/store -f charts/store/values-prod.yaml --set store.id=ci000001
          helm lint charts/platform
          helm lint charts/platform -f charts/platform/values-prod.yaml

      - name: Shell syntax
        run: bash -n scripts/*.sh && sh -n charts/store/files/seed.sh

  images:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix (lowercase repository)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}

      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: platform/frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dashboard:latest
            ${{ env.IMAGE_PREFIX }}/dashboard:${{ github.sha }}
