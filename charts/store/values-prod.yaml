# Production VPS profile (k3s). Only differences from values.yaml are listed:
# real wildcard DNS (*.stores.example.com pointing at the VPS), HTTPS via
# cert-manager, k3s local-path storage, stricter per-container limits and
# larger volumes. The orchestrator passes baseDomain and tls from its config;
# they are set here too for a manual `helm install`.
global:
  baseDomain: "stores.example.com"
  tls: true
  clusterIssuer: "letsencrypt-prod"
  storageClass: "local-path"

guardrails:
  limitRange:
    default:
      cpu: 200m
    max:
      cpu: 500m
      memory: 512Mi

mariadb:
  storage: 2Gi

wordpress:
  storage: 2Gi
