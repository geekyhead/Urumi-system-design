# Local Kind / k3d / Minikube profile. Only differences from values.yaml are
# listed: Kind's "standard" StorageClass, a *.localhost alias for browsers
# that block nip.io, and relaxed limits so a laptop can run several stores
# while WooCommerce installs. The orchestrator also passes baseDomain and tls.
global:
  storageClass: "standard"
  # store-<id>.localhost resolves to 127.0.0.1 in Chrome/Firefox without DNS.
  aliasDomains: ["localhost"]

guardrails:
  resourceQuota:
    limitsCpu: "2"
    limitsMemory: 2Gi
    pods: 8

mariadb:
  resources:
    limits:
      cpu: 750m
      memory: 640Mi

wordpress:
  resources:
    limits:
      cpu: 750m
      memory: 640Mi
