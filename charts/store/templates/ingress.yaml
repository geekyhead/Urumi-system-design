apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    {{- if .Values.global.tls }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- if .Values.global.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.global.clusterIssuer | quote }}
    {{- end }}
    {{- else }}
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls }}
  tls:
    - hosts:
        - {{ include "store.host" . | quote }}
      secretName: {{ .Release.Name }}-tls
    {{- with .Values.global.customDomains }}
    # Customer domains get their own certificate so adding one never
    # re-issues the platform subdomain certificate.
    - hosts:
        {{- range . }}
        - {{ lower . | quote }}
        {{- end }}
      secretName: {{ $.Release.Name }}-custom-tls
    {{- end }}
  {{- end }}
  rules:
    {{- range (include "store.hosts" . | fromJsonArray) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-wordpress
                port:
                  name: http
    {{- end }}
