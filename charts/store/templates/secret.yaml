{{- /*
Credentials are generated once. On upgrade the existing Secret is looked up
and its values are reused, so `helm upgrade --install` never rotates the
database password out from under a running MariaDB.
*/ -}}
{{- $name := include "store.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ include "store.secretValue" (list $data "mariadb-root-password" 32) }}
  mariadb-password: {{ include "store.secretValue" (list $data "mariadb-password" 32) }}
  admin-user: {{ .Values.store.adminUser | b64enc }}
  admin-password: {{ include "store.secretValue" (list $data "admin-password" 24) }}
  wp-auth-key: {{ include "store.secretValue" (list $data "wp-auth-key" 64) }}
  wp-secure-auth-key: {{ include "store.secretValue" (list $data "wp-secure-auth-key" 64) }}
  wp-logged-in-key: {{ include "store.secretValue" (list $data "wp-logged-in-key" 64) }}
  wp-nonce-key: {{ include "store.secretValue" (list $data "wp-nonce-key" 64) }}
