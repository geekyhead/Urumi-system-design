nameOverride: ""

api:
  image:
    repository: store-platform/api
    tag: local
    pullPolicy: IfNotPresent
  # More than one replica needs audit.backend=postgres. Every replica serves
  # the API; a Kubernetes Lease picks the one replica that runs the reconciler.
  replicas: 2
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Only used when audit.backend=sqlite.
  persistence:
    enabled: true
    size: 256Mi
    storageClass: ""

dashboard:
  image:
    repository: store-platform/dashboard
    tag: local
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

orchestrator:
  # "local" uses charts/store/values-local.yaml, "prod" uses values-prod.yaml.
  storeProfile: local
  storeBaseDomain: "127.0.0.1.nip.io"
  storeTls: false
  # Stores also answer on store-<id>.<alias>; clear for production.
  storeAliasDomains: ["localhost"]
  maxStores: 10
  maxConcurrentProvisions: 3
  provisionTimeoutSeconds: 300
  deleteTimeoutSeconds: 300
  reconcileIntervalMs: 5000
  helmTimeout: 5m
  mutationRateLimitPerMinute: 30
  # Custom domains: customers create an A record to this address (or a CNAME
  # to publicIngressHostname). Local Kind uses 127.0.0.1.
  publicIngressAddress: "127.0.0.1"
  publicIngressHostname: ""
  maxCustomDomains: 3
  leaderElection: true

auth:
  enabled: true
  # Tokens are generated into the <release>-auth Secret on first install and
  # kept on upgrades. Read them with `make tokens`.
  users:
    - name: admin
      role: admin
      maxStores: 10
    - name: demo
      role: user
      maxStores: 2

audit:
  # postgres: shared by all API replicas. sqlite: single replica only.
  backend: postgres

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

autoscaling:
  # Requires metrics-server (bundled with k3s; not installed on Kind).
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true

rbac:
  # Denies the API ServiceAccount any namespace/RoleBinding write outside
  # store-* namespaces (requires Kubernetes >= 1.30).
  admissionPolicy:
    enabled: true

ingress:
  enabled: true
  className: nginx
  host: platform.127.0.0.1.nip.io
  # Extra hostnames for the dashboard (platform.localhost works without DNS).
  aliasHosts: ["platform.localhost"]
  tls: false
  clusterIssuer: ""
  # Extra annotations, e.g. external auth or source IP allow-lists.
  annotations: {}
