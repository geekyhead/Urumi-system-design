{{- $postgres := eq .Values.audit.backend "postgres" -}}
{{- if and $postgres (not .Values.postgres.enabled) -}}
{{- fail "audit.backend=postgres requires postgres.enabled=true" -}}
{{- end -}}
{{- if and (not $postgres) (or (gt (int .Values.api.replicas) 1) .Values.autoscaling.enabled) -}}
{{- fail "more than one API replica (or autoscaling) requires audit.backend=postgres" -}}
{{- end -}}
{{- $sqlitePvc := and (not $postgres) .Values.api.persistence.enabled -}}
{{- if $sqlitePvc }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform.fullname" . }}-api-data
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-api
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    {{- if $sqlitePvc }}
    # A single RWO SQLite volume cannot be mounted by old and new pods at once.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/users: {{ toJson .Values.auth | sha256sum }}
    spec:
      serviceAccountName: {{ include "platform.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: api
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "platform.fullname" . }}-api
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if $postgres }}
            - name: PGHOST
              value: {{ include "platform.fullname" . }}-postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: platform
            - name: PGDATABASE
              value: platform
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.fullname" . }}-postgres
                  key: password
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.auth.enabled }}
            - name: auth
              mountPath: /etc/platform-auth
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if $sqlitePvc }}
          persistentVolumeClaim:
            claimName: {{ include "platform.fullname" . }}-api-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.auth.enabled }}
        - name: auth
          secret:
            secretName: {{ include "platform.fullname" . }}-auth
        {{- end }}
