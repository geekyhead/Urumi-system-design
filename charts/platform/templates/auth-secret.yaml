{{- if .Values.auth.enabled }}
{{- /*
Users and API tokens. Tokens are generated once and looked up on upgrade, so
`helm upgrade` never invalidates tokens people already use. Adding a user to
values generates a token only for that user.
*/ -}}
{{- $name := printf "%s-auth" (include "platform.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $tokens := dict -}}
{{- if and $existing $existing.data (hasKey $existing.data "users.json") -}}
{{- range (index $existing.data "users.json" | b64dec | fromJsonArray) -}}
{{- $_ := set $tokens .name .token -}}
{{- end -}}
{{- end -}}
{{- $users := list -}}
{{- range .Values.auth.users -}}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{0,30}$" .name) -}}
{{- fail (printf "auth.users: invalid user name %q" .name) -}}
{{- end -}}
{{- $token := get $tokens .name | default (randAlphaNum 40) -}}
{{- $users = append $users (dict "name" .name "role" (.role | default "user") "maxStores" (.maxStores | default 3) "token" $token) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  users.json: {{ toJson $users | b64enc }}
{{- end }}
